services:
  traefik:
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "8081:8080"   # Traefik dashboard
    volumes:
      - traefik_acme:/acme

  childdev-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.childdev.rule=Host(`${CHILDDEV_HOST}`)"
      - "traefik.http.routers.childdev.entrypoints=websecure"
      - "traefik.http.routers.childdev.tls=true"
      - "traefik.http.routers.childdev.tls.certresolver=letsencrypt"
      - "traefik.http.services.childdev.loadbalancer.server.port=8080"

volumes:
  traefik_acme:
