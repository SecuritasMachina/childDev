services:
  traefik:
    image: traefik:v2.11
    network_mode: host
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=[::]:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=[::]:443"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.letsencrypt.acme.email=charlesd@havranek.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    restart: unless-stopped

  childdev-api:
    build:
      context: ./ChildDev.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CHILDDEV_DB_CONNECTION: ${CHILDDEV_DB_CONNECTION}
      CHILDDEV_JWT_SECRET: ${CHILDDEV_JWT_SECRET}
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - childdev_dataprotection:/root/.aspnet/DataProtection-Keys
      - /opt/childdev/downloads:/app/wwwroot/downloads
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.childdev.rule=Host(`levelup.securitasmachina.org`)"
      - "traefik.http.routers.childdev.entrypoints=websecure"
      - "traefik.http.routers.childdev.tls=true"
      - "traefik.http.routers.childdev.tls.certresolver=letsencrypt"
      - "traefik.http.services.childdev.loadbalancer.server.port=8080"
      - "traefik.docker.network=childdev_default"

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: childdev
      MARIADB_USER: childdev
      MARIADB_PASSWORD: ${CHILDDEV_DB_PASSWORD:-}
    volumes:
      - childdev_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  childdev_mariadb:
  childdev_dataprotection:
  letsencrypt:
