services:
  childdev-api:
    build:
      context: ./ChildDev.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CHILDDEV_DB_CONNECTION: ${CHILDDEV_DB_CONNECTION}
      CHILDDEV_JWT_SECRET: ${CHILDDEV_JWT_SECRET}
    ports:
      - "8283:8080"
    networks:
      - ai_internal
    volumes:
      - childdev_dataprotection:/root/.aspnet/DataProtection-Keys
      - ./ChildDev.Api/wwwroot/downloads:/app/wwwroot/downloads
    restart: unless-stopped

volumes:
  childdev_dataprotection:

networks:
  ai_internal:
    external: true
