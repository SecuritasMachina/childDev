services:
  traefik:
    image: traefik:v2.11
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=charlesd@havranek.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    restart: unless-stopped

  childdev-api:
    build:
      context: ./ChildDev.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CHILDDEV_DB_CONNECTION: "Server=mariadb;Database=childdev;User=childdev;Password=${CHILDDEV_DB_PASSWORD};"
      CHILDDEV_JWT_SECRET: ${CHILDDEV_JWT_SECRET}
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - childdev_dataprotection:/root/.aspnet/DataProtection-Keys
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.childdev-http.rule=Host(`childdev.havranek.com`)"
      - "traefik.http.routers.childdev-http.entrypoints=web"
      - "traefik.http.routers.childdev-http.middlewares=https-redirect"
      - "traefik.http.routers.childdev.rule=Host(`childdev.havranek.com`)"
      - "traefik.http.routers.childdev.entrypoints=websecure"
      - "traefik.http.routers.childdev.tls=true"
      - "traefik.http.routers.childdev.tls.certresolver=letsencrypt"
      - "traefik.http.services.childdev.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: childdev
      MARIADB_USER: childdev
      MARIADB_PASSWORD: ${CHILDDEV_DB_PASSWORD}
    volumes:
      - childdev_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  childdev_mariadb:
  childdev_dataprotection:
  letsencrypt:
