<?xml version="1.0" encoding="UTF-8"?>
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Star glow -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Text glow -->
    <filter id="textglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Radial halo behind star -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFE082" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft halo glow behind star -->
  <ellipse cx="228" cy="172" rx="105" ry="100" fill="url(#halo)"/>

  <!-- 5-pointed star centered at (228, 172), outer r=82, inner r=34 -->
  <!-- Outer: 228,90  304,148  276,238  180,238  152,148 -->
  <!-- Inner: 248,145 260,184 228,207  196,184  208,145 -->
  <path d="M228,90 L248,145 L304,148 L260,184 L276,238 L228,207 L180,238 L196,184 L152,148 L208,145 Z"
        fill="#FFD740" filter="url(#glow)"/>
  <!-- Inner highlight for depth -->
  <path d="M228,108 L242,148 L285,150 L254,178 L266,218 L228,198 L190,218 L202,178 L171,150 L214,148 Z"
        fill="rgba(255,255,255,0.28)"/>
  <!-- Star center shine dot -->
  <circle cx="228" cy="175" r="10" fill="rgba(255,255,255,0.22)"/>

  <!-- Scattered sparkle cross-stars (4-pointed) -->
  <path d="M72,88 L74.5,96 L83,98.5 L74.5,101 L72,109 L69.5,101 L61,98.5 L69.5,96 Z" fill="rgba(255,255,255,0.75)"/>
  <path d="M378,78 L380,85 L387,87 L380,89 L378,96 L376,89 L369,87 L376,85 Z" fill="rgba(255,220,60,0.85)"/>
  <path d="M55,290 L57,296 L63,298 L57,300 L55,306 L53,300 L47,298 L53,296 Z" fill="rgba(255,255,255,0.6)"/>
  <path d="M396,285 L398,291 L404,293 L398,295 L396,301 L394,295 L388,293 L394,291 Z" fill="rgba(255,200,60,0.7)"/>
  <path d="M145,60 L146.5,65 L152,66.5 L146.5,68 L145,73 L143.5,68 L138,66.5 L143.5,65 Z" fill="rgba(255,255,255,0.55)"/>
  <path d="M312,52 L314,58 L320,60 L314,62 L312,68 L310,62 L304,60 L310,58 Z" fill="rgba(255,240,100,0.7)"/>
  <path d="M110,350 L111.5,355 L117,356.5 L111.5,358 L110,363 L108.5,358 L103,356.5 L108.5,355 Z" fill="rgba(255,255,255,0.5)"/>
  <path d="M340,340 L342,347 L349,349 L342,351 L340,358 L338,351 L331,349 L338,347 Z" fill="rgba(255,210,60,0.65)"/>

  <!-- Circle dots for extra sparkle -->
  <circle cx="95"  cy="145" r="3.5" fill="rgba(255,220,120,0.7)"/>
  <circle cx="55"  cy="200" r="2.5" fill="rgba(255,255,255,0.55)"/>
  <circle cx="40"  cy="160" r="2"   fill="rgba(200,160,255,0.6)"/>
  <circle cx="408" cy="175" r="3"   fill="rgba(255,255,255,0.6)"/>
  <circle cx="415" cy="130" r="2"   fill="rgba(255,220,80,0.6)"/>
  <circle cx="420" cy="240" r="2.5" fill="rgba(180,220,255,0.6)"/>
  <circle cx="80"  cy="380" r="2"   fill="rgba(255,255,255,0.45)"/>
  <circle cx="375" cy="390" r="2.5" fill="rgba(255,220,80,0.55)"/>
  <circle cx="195" cy="48"  r="2"   fill="rgba(255,255,255,0.5)"/>
  <circle cx="262" cy="42"  r="2.5" fill="rgba(255,200,80,0.55)"/>

  <!-- ChildDev wordmark -->
  <text x="228" y="292"
        text-anchor="middle"
        font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-size="58" font-weight="900"
        fill="white"
        filter="url(#textglow)"
        letter-spacing="1">ChildDev</text>

  <!-- Tagline -->
  <text x="228" y="330"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="19"
        fill="rgba(255,255,255,0.78)"
        letter-spacing="0.5">Your goals · Your story</text>

  <!-- Bottom decorative dots row -->
  <circle cx="184" cy="368" r="4"   fill="rgba(255,220,60,0.7)"/>
  <circle cx="206" cy="375" r="3"   fill="rgba(255,255,255,0.5)"/>
  <circle cx="228" cy="378" r="5"   fill="rgba(255,220,60,0.8)"/>
  <circle cx="250" cy="375" r="3"   fill="rgba(255,255,255,0.5)"/>
  <circle cx="272" cy="368" r="4"   fill="rgba(255,220,60,0.7)"/>
</svg>
