log_format downloads '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    access_log /dev/stdout downloads;
    error_log  /dev/stderr warn;

    # Serve files directly from root (e.g. /LevelUp.apk)
    location / {
        types {
            application/vnd.android.package-archive  apk;
        }
        default_type application/octet-stream;

        # No caching — always fetch the latest APK
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
        add_header X-Content-Type-Options "nosniff";

        try_files $uri =404;
    }

    # Lightweight health check (Traefik / uptime monitors)
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
